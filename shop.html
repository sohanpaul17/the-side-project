<body data-page="shop">
<main>
  <section class="page-hero">
    <span class="orbit-deco"></span>
    <div class="wrap">
      <nav class="breadcrumb reveal"><a href="index.html">Home</a> / <span>Shop</span></nav>
      <h1 class="h-display h1"><span class="split-line"><span>The shop</span></span></h1>
      <p class="lead reveal" style="--d:.2s;margin-top:18px">Hand-illustrated gifts about your story — each one made to order and delivered to your door.</p>
    </div>
  </section>
  <section class="section" style="padding-top:10px">
    <div class="wrap">
      <div class="toolbar reveal">
        <div class="chips" id="chips"></div>
        <div class="tools-right">
          <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search products" aria-label="Search products"></label>
          <label class="field select"><select id="sort" aria-label="Sort products"><option value="featured">Sort: Featured</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="az">Name: A–Z</option></select></label>
        </div>
      </div>
      <div class="result-count" id="count"></div>
      <div class="product-grid" id="grid"></div>
    </div>
  </section>
</main>
